<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | VPH Media Production</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #050505 !important;
      color: #ffffff;
    }
    .glow-bg {
      background: radial-gradient(circle at 50% 0%, rgba(250, 204, 21, 0.08), transparent 40%),
                  radial-gradient(circle at 85% 45%, rgba(147, 51, 234, 0.12), transparent 45%),
                  radial-gradient(circle at 10% 80%, rgba(250, 204, 21, 0.05), transparent 40%);
    }
    .btn-purple-gradient {
      background: linear-gradient(135deg, #9333ea 0%, #6366f1 100%);
      transition: all 0.3s ease;
    }
    .btn-purple-gradient:hover {
      background: linear-gradient(135deg, #a855f7 0%, #4f46e5 100%);
      box-shadow: 0 10px 25px -5px rgba(147, 51, 234, 0.5);
    }
  </style>
</head>
<body class="glow-bg min-h-screen flex flex-col justify-between selection:bg-yellow-400 selection:text-black">

  <!-- Header -->
  <header class="w-full border-b border-neutral-900 bg-black sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center">
        <img src="image.jpg" alt="VPH Media Production Logo" class="h-9 sm:h-12 w-auto object-contain block" />
      </a>
      <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-neutral-300">
        <a href="index.html" class="hover:text-yellow-400 transition-colors">HOME</a>
        <a href="about.html" class="hover:text-yellow-400 transition-colors">ABOUT US</a>
        <a href="projects.html" class="hover:text-yellow-400 transition-colors">PROJECTS</a>
        <a href="careers.html" class="hover:text-yellow-400 transition-colors">CAREERS</a>
        <a href="contact.html" class="text-yellow-400 border-b-2 border-yellow-400 pb-1">CONTACT US</a>
      </nav>
      <a href="https://www.facebook.com/share/1DPZy6Haj1/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="hidden md:inline-flex btn-purple-gradient text-xs sm:text-sm font-semibold px-5 py-2.5 rounded-full text-white shadow-md items-center gap-1.5">
        <span>Let's Talk</span>
        <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
      </a>
      <button id="menu-btn" class="md:hidden text-white p-2 focus:outline-none" aria-label="Toggle menu">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
    </div>
    <div id="mobile-menu" class="hidden md:hidden bg-black/95 border-b border-neutral-800 px-6 py-5 flex flex-col gap-4 text-sm font-semibold">
      <a href="index.html" class="hover:text-yellow-400">HOME</a>
      <a href="about.html" class="hover:text-yellow-400">ABOUT US</a>
      <a href="projects.html" class="hover:text-yellow-400">PROJECTS</a>
      <a href="careers.html" class="hover:text-yellow-400">CAREERS</a>
      <a href="contact.html" class="text-yellow-400">CONTACT US</a>
      <a href="https://www.facebook.com/share/1DPZy6Haj1/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="btn-purple-gradient text-center py-2.5 rounded-full text-white mt-2">
        Let's Talk on Facebook
      </a>
    </div>
  </header>

  <!-- Contact Form & CRM Section -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-16 sm:py-24 flex-1 w-full">
    <div class="text-center mb-12">
      <span class="text-yellow-400 font-mono text-xs tracking-widest uppercase mb-2 block">Direct Communication</span>
      <h1 class="text-3xl sm:text-5xl font-extrabold uppercase mb-4 text-white">Let’s Start Your Project</h1>
      <p class="text-neutral-400 text-sm sm:text-base max-w-lg mx-auto">
        Fill out the inquiry form below and our team will get back to you within 24 hours.
      </p>
    </div>

    <!-- Contact Form with Direct Submit to Firestore CRM Hook -->
    <div class="p-6 sm:p-10 rounded-3xl border border-neutral-800 bg-[#0d0d0d] shadow-2xl">
      <form id="contact-form" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-300 mb-2">Full Name</label>
          <input type="text" id="name" required placeholder="Juan Dela Cruz" class="w-full bg-[#141414] border border-neutral-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-yellow-400 transition-colors" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-300 mb-2">Email Address</label>
            <input type="email" id="email" required placeholder="you@company.com" class="w-full bg-[#141414] border border-neutral-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-yellow-400 transition-colors" />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-300 mb-2">Phone / WhatsApp</label>
            <input type="tel" id="phone" placeholder="+63 900 000 0000" class="w-full bg-[#141414] border border-neutral-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-yellow-400 transition-colors" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-300 mb-2">Project Scope</label>
          <select id="service" class="w-full bg-[#141414] border border-neutral-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-yellow-400 transition-colors">
            <option value="web">Web Development & Landing Page</option>
            <option value="media">Video Production & Media Commercial</option>
            <option value="branding">Brand Strategy & Creative Identity</option>
            <option value="other">Other Inquiry</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-300 mb-2">Project Brief</label>
          <textarea id="message" rows="4" required placeholder="Tell us about your brand, goals, and target launch timeline..." class="w-full bg-[#141414] border border-neutral-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-yellow-400 transition-colors"></textarea>
        </div>

        <button type="submit" id="submit-btn" class="btn-purple-gradient w-full py-4 rounded-xl font-bold text-sm text-white shadow-xl flex items-center justify-center gap-2">
          <span>Submit Project Inquiry</span>
          <i data-lucide="send" class="w-4 h-4"></i>
        </button>

        <p id="status-msg" class="text-center text-xs font-semibold mt-3 hidden"></p>
      </form>
    </div>
  </main>

  <footer class="border-t border-neutral-900 bg-black py-8 text-center text-xs tracking-wider text-neutral-400 font-semibold uppercase px-4">
    <p>2026 VPH MEDIA PRODUCTION ALL RIGHTS RESERVE</p>
  </footer>

  <!-- Firebase App & Firestore SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // Replace with your Firebase Project Configuration from Firebase Console
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    let db;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch (e) {
      console.log("Firebase config pending: Inquiries fall back to mailto.");
    }

    const form = document.getElementById("contact-form");
    const statusMsg = document.getElementById("status-msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;
      const service = document.getElementById("service").value;
      const message = document.getElementById("message").value;

      statusMsg.classList.remove("hidden", "text-red-400", "text-yellow-400");
      statusMsg.classList.add("text-yellow-400");
      statusMsg.innerText = "Submitting your inquiry...";

      try {
        if (db && firebaseConfig.apiKey !== "YOUR_API_KEY") {
          // Direct write into CRM inquiries collection
          await addDoc(collection(db, "inquiries"), {
            name,
            email,
            phone,
            service,
            message,
            createdAt: serverTimestamp()
          });
        }
        statusMsg.innerText = "Thank you! Your project inquiry has been received.";
        form.reset();
      } catch (err) {
        console.error(err);
        // Fallback email trigger
        window.location.href = `mailto:hello@vphmedia.com?subject=Project Inquiry - ${name}&body=${encodeURIComponent(message)}`;
        statusMsg.innerText = "Redirecting via email client...";
      }
    });
  </script>

  <script>
    lucide.createIcons();
    const btn = document.getElementById('menu-btn');
    const menu = document.getElementById('mobile-menu');
    btn.addEventListener('click', () => menu.classList.toggle('hidden'));
  </script>
</body>
</html>
